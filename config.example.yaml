  max_concurrent: 5
  daily_loss_limit_pct: 0.09
  max_drawdown_pct: 0.18
  min_edge_after_fees: 0.012

markets:
  targets:
    - "btc"
    - "eth"
  windows:
    - "5m"
    - "15m"

signals:
  min_score: 0.60                 # starting threshold (adaptive)
  lookback_minutes: 30

learning:
  calibration_window: 150
  regime_lookback: 40
  exploration_pct: 0.07           # small degen exploration budget

execution:
  prefer_maker: true
  max_slippage_bps: 25
