bankroll: 1000.0

risk:
  max_position_pct: 0.04
  max_concurrent: 4
  daily_loss_limit_pct: 0.08
  max_drawdown_pct: 0.15
  min_edge_after_fees: 0.02

markets:
  targets:
    - "btc"
    - "eth"
  windows:
    - "5m"
    - "15m"

signals:
  min_score: 0.56
  degen_mode: true
  fee_rate: 0.01
  # 5m/15m resolve ~50/50 — only buy relatively cheap shares
  max_entry_price: 0.55
  min_abs_momentum: 0.12
  lookback_minutes: 30
  min_depth_usd: 20.0
  min_time_remaining_pct: 0.10
  max_time_remaining_pct: 0.98
  max_prob_lift: 0.10

learning:
  calibration_window: 150
  regime_lookback: 40
  # Keep exploration small; most random 5m bets lose after fees
  exploration_pct: 0.03

execution:
  prefer_maker: true
  max_slippage_bps: 20
  cycle_seconds: 10
  cooldown_seconds: 60
  max_markets_per_cycle: 12
  stale_grace_seconds: 300
  stale_max_hold_minutes: 35
