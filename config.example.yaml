bankroll: 1000.0

risk:
  max_position_pct: 0.045
  max_concurrent: 6
  max_total_exposure_pct: 0.22
  max_asset_exposure_pct: 0.15
  max_window_exposure_pct: 0.18
  daily_loss_limit_pct: 0.06
  max_drawdown_pct: 0.14
  min_edge_after_fees: 0.012
  probability_model_calibrated: false

markets:
  targets:
    - "btc"
    - "eth"
  windows:
    - "5m"
    # 15m has been a drag; keep disabled until complete-set + late-window prove out
    # - "15m"

signals:
  min_score: 0.50
  degen_mode: true
  fee_rate: 0.07
  chainlink_enabled: true
  max_entry_price: 0.62
  min_abs_momentum: 0.08
  lookback_minutes: 20
  min_depth_usd: 10.0
  min_time_remaining_pct: 0.05
  max_time_remaining_pct: 0.99
  max_prob_lift: 0.06
  near_resolution_boost: true
  # Temporary bootstrap: allow heuristic probes so calibrator can build samples.
  # Flip back to false once ~30 resolves exist and calibrated path is live.
  allow_heuristic_paper_entries: true

learning:
  calibration_window: 80
  regime_lookback: 25
  exploration_pct: 0.015

execution:
  prefer_maker: true
  paper_slippage_bps: 15
  max_book_age_seconds: 8
  max_slippage_bps: 35
  cycle_seconds: 6
  cooldown_seconds: 30
  max_markets_per_cycle: 18
  stale_grace_seconds: 240
  stale_max_hold_minutes: 28
  execute_complete_set: true
  complete_set_max_pair: 0.97
  complete_set_min_edge: 0.002

strategy_portfolio:
  enabled: false
  starting_bankroll: 1000.0
  reserve_cash_pct: 0.18
  max_strategy_pct: 0.28
  max_position_pct: 0.045
  compound_only_settled_net_pnl: true
  weights:
    astf_intraday: 0.40
    near_resolution: 0.25
    complete_set: 0.15
    weekly_price_ranges: 0.10
    weather_station: 0.05
    cross_market_arb: 0.05

exit_policy:
  enabled: true
  take_profit_pct: 0.18
  stop_loss_pct: 0.12
  max_hold_seconds: 150
  max_book_age_seconds: 3
  fill_fraction: 0.60
  slippage_bps: 15

live_execution:
  enabled: false
  max_order_notional_usd: 10.0
  max_position_pct: 0.01
  max_total_exposure_pct: 0.05
  max_open_orders: 1
  max_book_age_seconds: 3
  max_spread: 0.05
  order_ttl_seconds: 600
